name: ZEE5 Channel Fetcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  fetch-zee5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Connect to Tailscale Exit Node
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          version: "1.66.0"
          args: --exit-node=100.125.144.27 --exit-node-allow-lan-access=true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check IP (Mobile Exit Node Test)
        run: curl -s https://ifconfig.me

      - name: Run ZEE5 Fetcher Script
        run: |
          python main.py

      - name: Auto-commit and push updated JSON files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update ZEE5 channels and tokens [skip ci]"
          file_pattern: "api/*.json"
          branch: main
          
