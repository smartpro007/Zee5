name: ZEE5 Channel Fetcher

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch-zee5:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Connect to Tailscale Exit Node
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: "1.66.0"
          args: --exit-node=100.125.144.27 --exit-node-allow-lan-access=true --accept-routes

      - name: Check Exit Node IP
        run: |
          echo "Current IP through Tailscale:"
          curl -s https://ifconfig.me
          echo ""

      - name: Run ZEE5 Fetcher Script
        run: |
          python main.py

      - name: Auto-commit and push updated JSON files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update ZEE5 channels and tokens [skip ci]"
          file_pattern: "api/*.json"
          branch: main
          
