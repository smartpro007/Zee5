name: ZEE5 Channel Fetcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  run-zee5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Tailscale Exit Node (तुमचा Poco मोबाईल) द्वारे भारतीय residential IP वरून कनेक्ट करणे
      - name: Connect to Tailscale Exit Node
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTH_KEY }}
          args: --exit-node=100.125.144.27 --exit-node-allow-lan-access=true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install requests

      - name: Check IP
        run: curl -s https://ifconfig.me

      - name: Run ZEE5 Fetcher Script
        run: |
          python main.py

      # तयार झालेली JSON फाईल थेट तुमच्या GitHub रिपॉझिटरीत ऑटोमॅटिक सेव्ह (Push) करण्यासाठी
      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api/*.json
          git commit -m "Auto-update ZEE5 channels and tokens [skip ci]" || exit 0
          git push

      - name: Upload Result Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zee5-channels-output
          path: api/*.json
